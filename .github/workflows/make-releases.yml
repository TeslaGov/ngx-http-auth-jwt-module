name: Make Releases

on:
  workflow_dispatch:

jobs:
  meta:
    name: Get Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{steps.meta.outputs.tag}}
    steps:

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Metadata
        id: meta
        run: |
          set -eu
          tag=$(git describe --tags --abbrev=0)

          echo "tag=${tag}" >> $GITHUB_OUTPUT

  build:
    name: "NGINX: ${{ matrix.nginx-version }}; libjwt: ${{ matrix.libjwt-version }}"
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nginx-version:
          - 1.24.0 # legacy
          - 1.26.3 # legacy
          - 1.28.3 # legacy
          - 1.30.2 # stable
          - 1.31.1 # mainline

        libjwt-version:
          - 1.10.2   # Debian
          - 1.17.2   # Ubuntu
          - 1.12.1   # UBI8
          - 1.18.4   # Latest libjwt release.
    env:
      NGINX_VERSION: ${{ matrix.nginx-version }}
      LIBJWT_VERSION: ${{ matrix.libjwt-version }}
    steps:

    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Build Module
      run: ./scripts build_module

    - name: Copy Binaries
      run: ./scripts cp_bin

    - name: Get Metadata
      id: meta
      run: |
        set -eu
        artifact="ngx-http-auth-jwt-module-${{needs.meta.outputs.tag}}_libjwt-${{matrix.libjwt-version}}_nginx-${{matrix.nginx-version}}"
        
        echo "artifact=${artifact}" >> $GITHUB_OUTPUT
        echo "filename=${artifact}.tgz" >> $GITHUB_OUTPUT

    - name: Create Release Archive
      run: tar czf ${{steps.meta.outputs.filename}} -C bin .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: ${{steps.meta.outputs.artifact}}
        path: ${{steps.meta.outputs.filename}}

  release:
    name: Create/Update Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Set-up Variables
        id: vars
        run: |
          echo "date_now=$(date --rfc-3339=seconds)" >> "${GITHUB_OUTPUT}"
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          set -eu
          
          cd artifacts

          for f in $(find . -type f); do
            echo "Staging: ${f}"
            mv "${f}" .
          done

          find . -type d -mindepth 1 -exec rm -rf "{}" +

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{needs.meta.outputs.tag}}
          name: "Pre-release: ${{needs.meta.outputs.tag}}"
          body: |
            > [!WARNING]
            > This is an automatically generated pre-release version of the module, which includes the latest master branch changes.
            > Please report any bugs you find.

            - Build Date: `${{ steps.vars.outputs.date_now }}`
            - Commit: `${{ github.sha }}`
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: artifacts/*
